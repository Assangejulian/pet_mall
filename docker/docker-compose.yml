services:
  mysql:
    image: mysql:8.0
    container_name: pat-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: pet_store
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - pat

  redis:
    image: redis:7-alpine
    container_name: pat-redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-777}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - pat

  natapp:
    image: natapp/natapp
    container_name: tunnelname
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: 1M
        max-file: 2
    environment:
      - authtoken=af31c13aa7a3c23f

networks:
  pat:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
