spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: pet-store
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:${DB_PORT:3306}/pet_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:777}
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:1337284817@qq.com}
    password: ${MAIL_PASSWORD:opojnycdzuktjacj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

ai:
  detection:
    url: http://127.0.0.1:9001/detect
  upload-dir: uploads/ai
  chat:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model-name: ${DEEPSEEK_MODEL:deepseek-chat}
    flash-model-name: ${DEEPSEEK_FLASH_MODEL:deepseek-chat}
    pro-model-name: ${DEEPSEEK_PRO_MODEL:deepseek-reasoner}
    temperature: ${DEEPSEEK_TEMPERATURE:0.3}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn
wx:
  miniapp:
    appid: ${WECHAT_MINI_APPID:}
    secret: ${WECHAT_MINI_SECRET:}
  pc:
    appid: ${WECHAT_PC_APPID:}
    secret: ${WECHAT_PC_SECRET:}