spring:
  application:
    name: pet-store
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:${DB_PORT:3306}/pet_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:doc/pet_store.sql,classpath:doc/seed.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:777}
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:1337284817@qq.com}
    password: ${MAIL_PASSWORD:opojnycdzuktjacj}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

ai:
  detection:
    url: http://127.0.0.1:9001/detect
  upload-dir: uploads/ai
  chat:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model-name: ${DEEPSEEK_MODEL:deepseek-chat}
    flash-model-name: ${DEEPSEEK_FLASH_MODEL:deepseek-chat}
    pro-model-name: ${DEEPSEEK_PRO_MODEL:deepseek-reasoner}
    temperature: ${DEEPSEEK_TEMPERATURE:0.3}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
    memory-turns: ${DEEPSEEK_MEMORY_TURNS:10}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:2048}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  charset:
    console: UTF-8
    file: UTF-8


arcsoft:
  app-id: ${ARCSOFT_APPID:}
  sdk-key: ${ARCSOFT_SDKKEY:}
  timeout: 10


face:
  provider: ${FACE_PROVIDER:mock}
  api-key: ${BAIDU_FACE_API_KEY:}
  secret-key: ${BAIDU_FACE_SECRET_KEY:}

wx:
  miniapp:
    appid: ${WECHAT_MINI_APPID:}
    secret: ${WECHAT_MINI_SECRET:}
  pc:
    appid: ${WECHAT_PC_APPID:}
    secret: ${WECHAT_PC_SECRET:}

alipay:
  app-id: ${ALIPAY_APPID:9021000165632109}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  notify-url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8080/api/notify/alipay}
  return-url: ${ALIPAY_RETURN_URL:http://127.0.0.1:8080/#/order/result}
  sign-type: RSA2
  charset: utf-8
  format: json
wechat-pay:
  appid: ${WECHAT_PAY_APPID:}
  mch-id: ${WECHAT_PAY_MCH_ID:}
  mch-serial-no: ${WECHAT_PAY_MCH_SERIAL_NO:}
  private-key: ${WECHAT_PAY_PRIVATE_KEY:}
  api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
  notify-url: ${WECHAT_PAY_NOTIFY_URL:http://127.0.0.1:8080/api/notify/wechat}

oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:pet-mall-20260702}
  domain: ${OSS_DOMAIN:https://pet-mall-20260702.oss-cn-beijing.aliyuncs.com}
