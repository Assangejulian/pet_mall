<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="720" viewBox="0 0 1380 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #222; font-size: 16px; }
      .title { font-size: 24px; font-weight: 700; }
      .role { font-size: 18px; font-weight: 700; writing-mode: vertical-rl; glyph-orientation-vertical: 0; }
      .box { fill: #d8e8ff; stroke: #4a86e8; stroke-width: 2; rx: 4; }
      .start { fill: #dff8e8; stroke: #18b66a; stroke-width: 2; rx: 24; }
      .data { fill: #fff3c4; stroke: #c79a19; stroke-width: 2; rx: 4; }
      .lane { fill: none; stroke: #bbb; stroke-width: 1.2; }
      .role-bg { fill: #f1f3f5; stroke: #bbb; stroke-width: 1.2; }
      .line { stroke: #333; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="690" y="38" text-anchor="middle" class="title">视频互动流程泳道图</text>

  <rect x="48" y="70" width="1284" height="580" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <rect x="48" y="70" width="70" height="580" class="role-bg"/>
  <line x1="48" y1="180" x2="1332" y2="180" class="lane"/>
  <line x1="48" y1="300" x2="1332" y2="300" class="lane"/>
  <line x1="48" y1="430" x2="1332" y2="430" class="lane"/>
  <line x1="48" y1="540" x2="1332" y2="540" class="lane"/>

  <text x="82" y="125" text-anchor="middle" class="role">用户</text>
  <text x="82" y="240" text-anchor="middle" class="role">小程序</text>
  <text x="82" y="365" text-anchor="middle" class="role">视频服务</text>
  <text x="82" y="485" text-anchor="middle" class="role">评论服务</text>
  <text x="82" y="595" text-anchor="middle" class="role">数据库</text>

  <!-- user lane -->
  <rect x="150" y="100" width="120" height="46" class="start"/>
  <text x="210" y="129" text-anchor="middle">进入视频页</text>
  <rect x="435" y="100" width="120" height="46" class="start"/>
  <text x="495" y="129" text-anchor="middle">播放/点赞</text>
  <rect x="720" y="100" width="120" height="46" class="start"/>
  <text x="780" y="129" text-anchor="middle">发表评论</text>
  <rect x="1100" y="100" width="130" height="46" class="start"/>
  <text x="1165" y="129" text-anchor="middle">查看结果</text>

  <!-- miniapp lane -->
  <rect x="150" y="216" width="120" height="46" class="box"/>
  <text x="210" y="244" text-anchor="middle">请求Feed</text>
  <rect x="435" y="216" width="120" height="46" class="box"/>
  <text x="495" y="244" text-anchor="middle">提交互动</text>
  <rect x="720" y="216" width="120" height="46" class="box"/>
  <text x="780" y="244" text-anchor="middle">提交评论</text>
  <rect x="1100" y="216" width="130" height="46" class="box"/>
  <text x="1165" y="244" text-anchor="middle">渲染视频页</text>

  <!-- video service lane -->
  <rect x="150" y="340" width="130" height="46" class="box"/>
  <text x="215" y="368" text-anchor="middle">查询上架视频</text>
  <rect x="435" y="340" width="130" height="46" class="box"/>
  <text x="500" y="368" text-anchor="middle">更新播放/点赞</text>
  <rect x="910" y="340" width="130" height="46" class="box"/>
  <text x="975" y="368" text-anchor="middle">更新评论数</text>

  <!-- comment service lane -->
  <rect x="720" y="462" width="130" height="46" class="box"/>
  <text x="785" y="490" text-anchor="middle">保存评论</text>

  <!-- database lane -->
  <rect x="150" y="572" width="130" height="46" class="data"/>
  <text x="215" y="600" text-anchor="middle">读取video</text>
  <rect x="435" y="572" width="130" height="46" class="data"/>
  <text x="500" y="600" text-anchor="middle">更新video</text>
  <rect x="720" y="572" width="130" height="46" class="data"/>
  <text x="785" y="600" text-anchor="middle">插入comment</text>
  <rect x="910" y="572" width="130" height="46" class="data"/>
  <text x="975" y="600" text-anchor="middle">更新评论数</text>

  <!-- arrows -->
  <path d="M210 146 L210 216" class="line"/>
  <path d="M210 262 L215 340" class="line"/>
  <path d="M215 386 L215 572" class="line"/>
  <path d="M280 595 L1100 239" class="line"/>

  <path d="M495 146 L495 216" class="line"/>
  <path d="M495 262 L500 340" class="line"/>
  <path d="M500 386 L500 572" class="line"/>
  <path d="M565 595 L1100 239" class="line"/>

  <path d="M780 146 L780 216" class="line"/>
  <path d="M780 262 L785 462" class="line"/>
  <path d="M785 508 L785 572" class="line"/>
  <path d="M850 595 L910 595" class="line"/>
  <path d="M975 572 L975 386" class="line"/>
  <path d="M1040 363 L1100 239" class="line"/>
  <path d="M1165 216 L1165 146" class="line"/>
</svg>
